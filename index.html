<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020203" />
  <title>The Doll Maker — Ending</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <main id="endingScreen" class="ending-screen" aria-live="polite">
    <div id="endingBackground" class="ending-background"></div>
    <div class="background-shade"></div>

    <div class="mist mist-one"></div>
    <div class="mist mist-two"></div>
    <div class="mist mist-three"></div>

    <div id="particles" class="particles" aria-hidden="true"></div>

    <section class="ending-content">
      <h1 id="endingTitle" class="ending-title"></h1>

      <div id="lettersBlock" class="letters-block">
        <p class="letters-label">ANGELICA'S LETTERS</p>

        <div class="letters-counter">
          <img
            class="letter-icon"
            src="assets/letter_icon.png"
            alt=""
            aria-hidden="true"
          />
          <span id="letterCount">0 / 6</span>
        </div>

        <p id="lettersMessage" class="letters-message">
          Congratulations — You Collected All of Angelica’s Letters
        </p>
      </div>

      <nav id="endingActions" class="ending-actions" aria-label="Ending options">
        <button
  id="creditsButton"
  class="ending-button"
  type="button"
>
  Credits
</button>

        <button id="mainMenuButton" class="ending-button" type="button">
  MAIN MENU
</button>

        <button class="ending-button shop-button is-disabled" type="button" disabled>
          <span>SHOP</span>
          <small>COMING SOON</small>
        </button>

        <button id="wallpaperButton" class="ending-button bonus-button" type="button" hidden>
          BONUS WALLPAPER
        </button>
      </nav>
    </section>
  </main>

  <section id="wallpaperScreen" class="wallpaper-screen" hidden>
    <div class="wallpaper-layout">
      <div class="wallpaper-image-wrap">
        <img
          id="wallpaperPreview"
          src="assets/bonus_wallpaper.png"
          alt="The Doll Maker bonus wallpaper"
        />
      </div>

      <div class="wallpaper-controls">
        <a
          class="ending-button"
          href="assets/bonus_wallpaper.png"
          download="The_Doll_Maker_Bonus_Wallpaper.png"
        >
          DOWNLOAD
        </a>

        <button id="wallpaperBackButton" class="ending-button" type="button">
          BACK
        </button>
      </div>
    </div>
  </section>

<script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js"></script>
<script src="script.js?v=12"></script>
</body>
</html>
